name: Deploy Backend to EC2

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🛠️ Build Backend (Làm trên GitHub cho mạnh)
        run: |
          cd backend
          npm install
          npx prisma generate
          npm run build

      - name: 🚚 Chuyển thư mục DIST sang EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/dist,backend/package.json,backend/ecosystem.config.js,backend/.env.production,backend/prisma"
          target: "~/app/e-commerce-project/"
          strip_components: 0

      - name: 🚀 SSH vào EC2 để khởi động lại
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app/e-commerce-project/backend
            npm install --production
            
            # 1. Cập nhật schema database Neon Production an toàn (Thêm PENDING enum)
            npm run db:push:prod
            
            # 2. Tạo lại Prisma Client trên EC2
            npx prisma generate
            
            # 3. Reload các app cũ (zero-downtime) & Đảm bảo khởi động ai-worker mới
            pm2 reload ecosystem.config.js --env production
            pm2 start ecosystem.config.js --env production --only ai-worker
            pm2 save

      - name: 🏥 Smoke Test (Check BE Health)
        run: |
          echo "Đợi 15 giây cho PM2 khởi động server..."
          sleep 15
          curl -f --retry 3 http://${{ secrets.EC2_HOST }}:3000/api/health || exit 1
          echo "✅ Deploy thành công! Backend đang chạy ngon lành!"

